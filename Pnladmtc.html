<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#180018">
<style>
  <body>
/* MENU MULTIJOGO */
.menu-multijogo{
  width:100%;
  padding:12px;
  background:#0c1220;
  border-radius:16px;
  box-sizing:border-box;
}

.menu-multijogo .titulo-menu{
  text-align:center;
  color:#f5c451;
  font-size:23px;
  font-weight:900;
  letter-spacing:2px;
  padding:12px 5px 5px;
}

.menu-multijogo .subtitulo-menu{
  text-align:center;
  color:#aab5c8;
  font-size:10px;
  margin-bottom:14px;
  letter-spacing:1px;
}

.menu-multijogo .grade-menu{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}

.menu-multijogo a{
  min-width:0;
  min-height:82px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:8px 3px;
  box-sizing:border-box;
  border-radius:13px;
  border:1px solid #34445f;
  background:linear-gradient(145deg,#202e47,#121c30);
  color:#fff;
  text-decoration:none;
  text-align:center;
  font-size:10px;
  font-weight:800;
  transition:.2s;
}

.menu-multijogo a:active{
  transform:scale(.95);
  background:#34445f;
}

.menu-multijogo .icone{
  font-size:23px;
  line-height:1;
}

.menu-multijogo a:hover{
  border-color:#f5c451;
  box-shadow:0 0 12px #f5c45135;
}

.menu-multijogo .rodape-menu{
  color:#8995aa;
  text-align:center;
  font-size:10px;
  padding-top:15px;
}
</style>

<div class="menu-multijogo">

  <div class="titulo-menu">PAINEL TIME CERTO</div>
  <div class="subtitulo-menu">
    SEU MUNDO DE JOGOS E OPORTUNIDADES
  </div>

  <div class="grade-menu">

    <a href="https://multyplay.netlify.app/pnltimecertao" target="_blank">
      <span class="icone">🎯</span> TIME CERTO ADM
    </a>

    

    <a href="https://multyplay.netlify.app/timecertotop" target="_blank">
      <span class="icone">🍀</span>index 
    </a>

    <a href="https://multyplay.netlify.app/pnltc" target="_blank">
      <span class="icone">🌟</span>BLOQUEIA ADM 
    </a>

    
    
  </div>

  <div class="rodape-menu">
    MULTIJOGO • TODOS OS JOGOS EM UM SÓ LUGAR
  </div>

</div>
